name: Phase 2 Package Lock Migration

on:
  push:
    branches:
      - chore/styna-improvement-phase-2
    paths:
      - .github/workflows/phase2-lock-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/styna-improvement-phase-2
      - name: Update package-lock metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.name = 'styna';
          if (lock.packages?.['']) {
            lock.packages[''].name = 'styna';
          }
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit package-lock metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock changes required."
            exit 0
          fi
          git commit -m "chore: align package-lock name with STYNA"
          git push origin HEAD:chore/styna-improvement-phase-2
