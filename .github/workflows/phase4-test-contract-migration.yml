name: Phase 4 test contract migration

on:
  push:
    branches:
      - chore/styna-improvement-phase-4
    paths:
      - .github/workflows/phase4-test-contract-migration.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/styna-improvement-phase-4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/phase4-test-contract-migration.js
      - name: Verify affected tests
        run: >-
          npm test -- --runInBand
          src/app/orders/checkout/page.test.tsx
          src/app/products/_components/ProductDetailClient.test.tsx
          src/app/orders/cart/page.test.tsx
          src/app/admin/events/_components/EventForm.test.tsx
      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/orders/checkout/page.test.tsx \
            src/app/products/_components/ProductDetailClient.test.tsx \
            src/app/orders/cart/page.test.tsx \
            src/app/admin/events/_components/EventForm.test.tsx
          git diff --cached --check
          git commit -m "test: align phase 4 ux contracts"
          git push origin HEAD:chore/styna-improvement-phase-4
