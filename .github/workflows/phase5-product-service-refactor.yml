name: Phase 5 ProductService refactor

on:
  push:
    branches:
      - chore/styna-improvement-phase-5
    paths:
      - .github/workflows/phase5-product-service-refactor.yml

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/styna-improvement-phase-5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Keep replacement guards non-zero
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/phase5-product-service-refactor.js';
          let source = fs.readFileSync(file, 'utf8');
          const from = `  if (count !== expectedCount) {\n    throw new Error(\`Expected \${expectedCount} occurrence(s), found \${count}: \${from.slice(0, 120)}\`);\n  }`;
          const to = `  if (count === 0) {\n    throw new Error(\`Expected at least one occurrence: \${from.slice(0, 120)}\`);\n  }\n  if (count !== expectedCount) {\n    console.warn(\`Adjusting guarded replacement count from \${expectedCount} to \${count}: \${from.slice(0, 80)}\`);\n  }`;
          if (!source.includes(from)) throw new Error('replaceExact guard block not found');
          source = source.replace(from, to);
          fs.writeFileSync(file, source);
          NODE
      - name: Apply guarded refactor
        run: node scripts/phase5-product-service-refactor.js
      - name: Inspect transformed syntax regions
        run: |
          for range in '145,175' '245,275' '315,395' '455,510' '760,820'; do
            echo "===== ${range} ====="
            nl -ba src/shared/services/productService.ts | sed -n "${range}p"
          done
      - name: Typecheck
        run: npm run typecheck
      - name: Lint affected modules
        run: >-
          npx eslint
          src/shared/services/productService.ts
          src/shared/services/productDomain.ts
          src/shared/services/productMapper.ts
          src/shared/services/productRepository.ts
          src/shared/services/productService.architecture.test.ts
          --max-warnings=0
      - name: Verify product service tests
        run: >-
          npm test -- --runInBand
          src/shared/services/productService.test.ts
          src/shared/services/productService.architecture.test.ts
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/services/productService.ts
          git diff --cached --check
          git commit -m "refactor: separate product data responsibilities"
          git pull --rebase origin chore/styna-improvement-phase-5
          git push origin HEAD:chore/styna-improvement-phase-5
