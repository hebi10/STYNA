name: Phase 4 Alert Migration

on:
  push:
    branches:
      - chore/styna-improvement-phase-4
    paths:
      - .github/workflows/phase4-alert-migration.yml
      - scripts/phase4-replace-alerts.cjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/styna-improvement-phase-4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace blocking alerts
        run: node scripts/phase4-replace-alerts.cjs
      - name: Verify diff
        run: |
          git diff --check
          git diff --exit-code --quiet && { echo "No migration changes produced"; exit 1; } || true
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "refactor: replace phase 4 blocking alerts"
          git push origin HEAD:chore/styna-improvement-phase-4
