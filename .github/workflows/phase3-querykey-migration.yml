name: Phase 3 Query Key Migration

on:
  push:
    branches:
      - chore/styna-improvement-phase-3
    paths:
      - .github/workflows/phase3-querykey-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/styna-improvement-phase-3
      - name: Replace direct user query key
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/app/mypage/info-edit/page.tsx';
          let text = fs.readFileSync(file, 'utf8');

          const importNeedle = 'import { useQueryClient } from "@tanstack/react-query";';
          const importReplacement = `${importNeedle}\nimport { userKeys } from "@/shared/hooks/queryKeys";`;
          if (!text.includes(importNeedle) || text.includes('import { userKeys } from "@/shared/hooks/queryKeys";')) {
            throw new Error('Unexpected info-edit import state');
          }
          text = text.replace(importNeedle, importReplacement);

          const queryNeedle = 'queryKey: ["user", user.uid]';
          if (!text.includes(queryNeedle)) {
            throw new Error('Direct user query key was not found');
          }
          text = text.replace(queryNeedle, 'queryKey: userKeys.detail(user.uid)');
          fs.writeFileSync(file, text);
          NODE
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/mypage/info-edit/page.tsx
          git commit -m "refactor: centralize info edit user query key"
          git push origin HEAD:chore/styna-improvement-phase-3
