name: Apply Phase 1 HTTP Policy

on:
  push:
    branches:
      - chore/styna-improvement-phase-1
    paths:
      - .github/workflows/phase1-apply-http-policy.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/styna-improvement-phase-1
      - name: Apply HTTP policy
        run: |
          node <<'NODE'
          const fs = require('fs');

          const handlerFiles = [
            'functions/src/handlers/adminUsers.ts',
            'functions/src/handlers/coupon.ts',
            'functions/src/handlers/event.ts',
            'functions/src/handlers/order.ts',
            'functions/src/handlers/points.ts',
            'functions/src/handlers/qna.ts',
            'functions/src/handlers/review.ts',
          ];

          const alreadyRestrictedFiles = [
            'functions/src/handlers/chat.ts',
            'functions/src/handlers/config.ts',
          ];

          const onRequestImport = 'import { onRequest } from "firebase-functions/v2/https";';
          const policyImport = 'import { ALLOWED_WEB_ORIGINS } from "../config/httpPolicy";';

          for (const file of handlerFiles) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes('ALLOWED_WEB_ORIGINS')) {
              source = source.replace(onRequestImport, `${onRequestImport}\n${policyImport}`);
            }
            source = source.replace(/cors:\s*true/g, 'cors: [...ALLOWED_WEB_ORIGINS]');
            fs.writeFileSync(file, source);
          }

          for (const file of alreadyRestrictedFiles) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes('ALLOWED_WEB_ORIGINS')) {
              source = source.replace(onRequestImport, `${onRequestImport}\n${policyImport}`);
            }
            source = source.replace(
              /cors:\s*\[\s*"http:\/\/localhost:3000",\s*"http:\/\/localhost:3001",\s*"https:\/\/hebimall\.firebaseapp\.com",\s*"https:\/\/hebimall\.web\.app",\s*\]/m,
              'cors: [...ALLOWED_WEB_ORIGINS]',
            );
            fs.writeFileSync(file, source);
          }

          for (const file of [
            'functions/src/handlers/coupon.ts',
            'functions/src/handlers/points.ts',
          ]) {
            let source = fs.readFileSync(file, 'utf8');
            source = source.replace(
              'error: error instanceof Error ? error.message : "Internal server error",',
              'error: "Internal server error",',
            );
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/src/handlers
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "fix: restrict HTTP function origins"
          git push origin HEAD:chore/styna-improvement-phase-1
