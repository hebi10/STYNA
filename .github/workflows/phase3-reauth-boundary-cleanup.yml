name: Phase 3 Reauth Boundary Cleanup

on:
  push:
    branches:
      - chore/styna-improvement-phase-3
    paths:
      - .github/workflows/phase3-reauth-boundary-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/styna-improvement-phase-3

      - name: Align reauthentication markers with persisted writes
        run: |
          node <<'NODE'
          const fs = require('fs');

          const MARKER = 'data-requires-reauth="true"';

          function findTagEnd(text, start) {
            let braceDepth = 0;
            let quote = null;
            let escaped = false;
            for (let i = start; i < text.length; i += 1) {
              const char = text[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (char === '\\') escaped = true;
                else if (char === quote) quote = null;
                continue;
              }
              if (char === '"' || char === "'" || char === '`') {
                quote = char;
                continue;
              }
              if (char === '{') braceDepth += 1;
              else if (char === '}') braceDepth = Math.max(0, braceDepth - 1);
              else if (char === '>' && braceDepth === 0) return i;
            }
            return -1;
          }

          function addMarker(tag, tagName) {
            if (tag.includes(MARKER)) return tag;
            return tag.replace(`<${tagName}`, `<${tagName} ${MARKER}`);
          }

          function removeMarker(tag) {
            return tag
              .replace(` ${MARKER}`, '')
              .replace(`${MARKER} `, '')
              .replace(MARKER, '');
          }

          function transform(file, decide) {
            const text = fs.readFileSync(file, 'utf8');
            const tagPattern = /<(button|select|form|input|Button)\b/g;
            let cursor = 0;
            let output = '';
            let added = 0;
            let removed = 0;
            let match;

            while ((match = tagPattern.exec(text)) !== null) {
              const start = match.index;
              const end = findTagEnd(text, start);
              if (end < 0) break;
              const tagName = match[1];
              let tag = text.slice(start, end + 1);
              const action = decide(tag, tagName);

              output += text.slice(cursor, start);
              if (action === 'add' && !tag.includes(MARKER)) {
                tag = addMarker(tag, tagName);
                added += 1;
              } else if (action === 'remove' && tag.includes(MARKER)) {
                tag = removeMarker(tag);
                removed += 1;
              }
              output += tag;
              cursor = end + 1;
              tagPattern.lastIndex = end + 1;
            }

            output += text.slice(cursor);
            fs.writeFileSync(file, output);
            console.log(`${file}: +${added} / -${removed}`);
            return { added, removed, output };
          }

          const categories = transform('src/app/admin/categories/page.tsx', (tag) => {
            if (tag.includes('toggleCategoryStatus')) return 'add';
            if (tag.includes('setShowAddForm(false)') || tag.includes('setEditingCategory(null)')) return 'remove';
            return null;
          });
          if (categories.added !== 1 || categories.removed !== 2) throw new Error('Unexpected category marker changes');

          const categoryOrder = transform('src/app/admin/category-order/page.tsx', (tag) => {
            if (tag.includes('resetToDefault') || tag.includes('saveOrder')) return 'add';
            return null;
          });
          if (categoryOrder.added !== 2) throw new Error('Expected two category-order write markers');

          const qna = transform('src/app/admin/qna/page.tsx', (tag) => {
            if (tag.includes('handleAnswerSubmit')) return 'add';
            return null;
          });
          if (qna.added !== 1) throw new Error('Expected QnA answer write marker');

          const productForm = transform('src/app/admin/dashboard/products/_components/EditProductForm.tsx', (tag) => {
            if (tag.includes('type="file"')) return 'add';
            if (tag.includes('styles.addInput') || tag.includes('onClick={onCancel}')) return 'remove';
            return null;
          });
          if (productForm.added !== 1 || productForm.removed !== 4) throw new Error('Unexpected product form marker changes');

          const users = transform('src/app/admin/dashboard/users/page.tsx', (tag) => {
            if (tag.includes('handleBulkPointGift')) return 'add';
            if (
              tag.includes('handlePointManagement')
              || tag.includes('setShowPointModal(false)')
              || tag.includes('setShowUserDetail(false)')
            ) return 'remove';
            return null;
          });
          if (users.added !== 1 || users.removed < 3) throw new Error('Unexpected user management marker changes');

          transform('src/app/admin/coupons/page.tsx', (tag) => {
            if (tag.includes('setShowCreateForm(true)')) return 'remove';
            return null;
          });

          transform('src/app/admin/inquiries/page.tsx', (tag) => {
            if (tag.includes('setShowAnswerModal(false)')) return 'remove';
            return null;
          });

          const eventForm = transform('src/app/admin/events/_components/EventForm.tsx', (tag) => {
            if (tag.includes('type="file"')) return 'add';
            if (tag.includes('handleCancel')) return 'remove';
            return null;
          });
          if (eventForm.added !== 2) throw new Error('Expected two event image upload markers');

          // Final structural guards before committing.
          const checks = [
            ['src/app/admin/categories/page.tsx', 'toggleCategoryStatus(category)', true],
            ['src/app/admin/category-order/page.tsx', 'saveOrder', true],
            ['src/app/admin/qna/page.tsx', 'handleAnswerSubmit', true],
            ['src/app/admin/dashboard/users/page.tsx', 'handleBulkPointGift', true],
          ];
          for (const [file, token] of checks) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(token) || !source.includes(MARKER)) {
              throw new Error(`Guard verification failed for ${file}`);
            }
          }
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin
          git diff --cached --check
          git commit -m "refactor: align admin reauth with persisted writes"
          git push origin HEAD:chore/styna-improvement-phase-3
